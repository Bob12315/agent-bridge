server:
  host: "127.0.0.1"
  port: 8000

runtime:
  database: "./runtime/bridge.db"
  workspace_root: "./runtime/workspaces"
  log_root: "./runtime/logs"

bridge:
  synchronous_wait_seconds: 30

deepseek:
  enabled: false
  transport: "mock"
  executable: "deepseek"
  # command_prefix: ["cmd", "/c"]
  command_prefix: []
  timeout_seconds: 1800
  health_timeout_seconds: 15
  # Set transport to "dsh-plugin" to prefer the local agent-bridge-dsh plugin.
  # The CLI adapter remains the automatic fallback if the plugin is unavailable.
  plugin_endpoint: "http://127.0.0.1:8765"
  plugin_token: null

codex:
  enabled: false
  transport: "mock"
  executable: "codex"
  # command_prefix: ["cmd", "/c"]
  command_prefix: []
  timeout_seconds: 1800
  health_timeout_seconds: 15

web:
  enabled: true

mcp:
  transport: "stdio"
  host: "127.0.0.1"
  port: 8001
  path: "/mcp"
