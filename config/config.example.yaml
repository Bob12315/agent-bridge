server:
  host: "127.0.0.1"
  port: 8000

runtime:
  database: "./runtime/bridge.db"
  workspace_root: "./runtime/workspaces"
  log_root: "./runtime/logs"

bridge:
  synchronous_wait_seconds: 30

deepseek:
  enabled: false
  transport: "mock"
  executable: "deepseek"
  timeout_seconds: 1800
  health_timeout_seconds: 15

codex:
  enabled: false
  transport: "mock"

web:
  enabled: true

mcp:
  transport: "stdio"
  host: "127.0.0.1"
  port: 8001
  path: "/mcp"
