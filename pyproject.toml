[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-bridge"
version = "0.1.0"
description = "One-hop communication bridge for ChatGPT, DeepSeek, and Codex"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
